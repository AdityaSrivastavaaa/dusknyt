# Render blueprint for the API (frontends deploy to Vercel/Cloudflare Pages)
services:
  - type: web
    name: dusknyt-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, value: "https://dusknyt-mdqh.vercel.app,https://dusknyt-promoter.vercel.app,https://dusknyt-admin.vercel.app" }
      - { key: NODE_ENV, value: production }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: SMTP_HOST, value: "smtp.gmail.com" }
      - { key: SMTP_PORT, value: "465" }
      - { key: SMTP_SECURE, value: "true" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: USER_APP_URL, value: "https://dusknyt-mdqh.vercel.app" }
      - { key: PROMOTER_APP_URL, value: "https://dusknyt-promoter.vercel.app" }
